<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comparisons :: FormSanity Instrumentation</title>
	<link rel="stylesheet" href="../lib/formsanity.css">
	<link rel="stylesheet" href="instrumentation.css">
	<script type="module">
		import { init } from '../lib/formsanity.js';
		init();
	</script>
</head>
<body>
	<header>
		<h1>FormSanity Instrumentation</h1>
		<nav>
			<ul>
				<li><a href="index.html">Required</a></li>
				<li><a href="types.html">Types</a></li>
				<li><a href="limits.html">Limits</a></li>
				<li><a href="comparisons.html" aria-current="page">Comparisons</a></li>
				<li><a href="relevance.html">Relevance</a></li>
				<li><a href="operations.html">Operations</a></li>
				<li><a href="choice-groups.html">Choice Groups</a></li>
				<li><a href="submission.html">Submission</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<form data-fs-form action="/api/submit" method="post">
			<fieldset>
				<legend>Literal Comparisons</legend>
				<ul>
					<li>
						<label for="secret-word">Secret Word</label>
						<input id="secret-word" name="secret-word" type="text" data-fs-equals="banana" placeholder="must equal &quot;banana&quot;">
					</li>
					<li>
						<label for="display-name">Display Name</label>
						<input id="display-name" name="display-name" type="text" data-fs-not-equals="admin" placeholder="must not equal &quot;admin&quot;">
					</li>
				</ul>
			</fieldset>
			<fieldset>
				<legend>Field Comparisons</legend>
				<ul>
					<li>
						<label for="password">Password</label>
						<input id="password" name="password" type="password" autocomplete="new-password" required>
					</li>
					<li>
						<label for="confirm">Confirm Password</label>
						<input id="confirm" name="confirm" type="password" autocomplete="new-password" required data-fs-equals-field="password">
					</li>
					<li>
						<label for="primary-email">Primary Email</label>
						<input id="primary-email" name="primary-email" type="text" data-fs-type="email">
					</li>
					<li>
						<label for="backup-email">Backup Email</label>
						<input id="backup-email" name="backup-email" type="text" data-fs-type="email" data-fs-not-equals-field="primary-email">
					</li>
				</ul>
			</fieldset>
			<fieldset>
				<legend>Date Comparisons</legend>
				<ul>
					<li>
						<label for="start">Start Date</label>
						<input id="start" name="start" type="date">
					</li>
					<li>
						<label for="end">End Date</label>
						<input id="end" name="end" type="date" data-fs-greater-than-field="start">
					</li>
				</ul>
			</fieldset>
			<button type="submit">Submit</button>
		</form>
	</main>
</body>
</html>
