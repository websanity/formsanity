<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comparisons :: FormSanity Instrumentation</title>
	<link rel="stylesheet" href="../lib/formsanity.css">
	<link rel="stylesheet" href="instrumentation.css">
	<script type="module">
		import { init } from '../lib/formsanity.js';
		init();
	</script>
</head>
<body>
	<header>
		<h1>FormSanity Instrumentation</h1>
		<nav>
			<ul>
				<li><a href="index.html">Required</a></li>
				<li><a href="types.html">Types</a></li>
				<li><a href="limits.html">Limits</a></li>
				<li><a href="comparisons.html" aria-current="page">Comparisons</a></li>
				<li><a href="relevance.html">Relevance</a></li>
				<li><a href="operations.html">Operations</a></li>
				<li><a href="choice-groups.html">Choice Groups</a></li>
				<li><a href="submission.html">Submission</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<form data-fs-form action="/api/submit" method="post">
			<fieldset>
				<legend>Equal to Field</legend>
				<ul class="cols">
					<li>
						<label for="email">Email address</label>
						<input id="email" name="email" type="text" data-fs-type="email">
					</li>
					<li>
						<label for="email-confirm">Confirm email</label>
						<input id="email-confirm" name="email-confirm" type="text" data-fs-type="email" data-fs-constraint="email-confirm == email" data-fs-constraint-message="Email addresses do not match.">
					</li>
					<li>
						<label for="password">Password</label>
						<input id="password" name="password" type="password" autocomplete="new-password" required data-fs-reveal>
					</li>
					<li>
						<label for="confirm">Confirm Password</label>
						<input id="confirm" name="confirm" type="password" autocomplete="new-password" required data-fs-constraint="confirm == password" data-fs-constraint-message="Passwords do not match." data-fs-reveal>
					</li>
				</ul>
			</fieldset>
			<fieldset>
				<legend>Not Equal to Field</legend>
				<ul class="cols">
					<li>
						<label for="email-primary">Primary Email</label>
						<input id="email-primary" name="email-primary" type="text" data-fs-type="email">
					</li>
					<li>
						<label for="email-secondary">Secondary Email</label>
						<input id="email-secondary" name="email-secondary" type="text" data-fs-type="email" data-fs-constraint="email-secondary != email-primary" data-fs-constraint-message="Must differ from your primary email.">
					</li>
					<li class="col-break">
						<label for="first-choice">First choice</label>
						<select id="first-choice" name="first-choice" data-fs-group-unique-values="choices">
							<option value="">choose…</option>
							<option>Option one</option>
							<option>Option two</option>
							<option>Option three</option>
							<option>Option four</option>
							<option>Option five</option>
							<option>Option six</option>
							<option>Option seven</option>
							<option>Option eight</option>
							<option>Option nine</option>
							<option>Option ten</option>
						</select>
					</li>
					<li>
						<label for="second-choice">Second choice</label>
						<select id="second-choice" name="second-choice" data-fs-group-unique-values="choices">
							<option value="">choose…</option>
							<option>Option one</option>
							<option>Option two</option>
							<option>Option three</option>
							<option>Option four</option>
							<option>Option five</option>
							<option>Option six</option>
							<option>Option seven</option>
							<option>Option eight</option>
							<option>Option nine</option>
							<option>Option ten</option>
						</select>
					</li>
					<li>
						<label for="third-choice">Third choice</label>
						<select id="third-choice" name="third-choice" data-fs-group-unique-values="choices">
							<option value="">choose…</option>
							<option>Option one</option>
							<option>Option two</option>
							<option>Option three</option>
							<option>Option four</option>
							<option>Option five</option>
							<option>Option six</option>
							<option>Option seven</option>
							<option>Option eight</option>
							<option>Option nine</option>
							<option>Option ten</option>
						</select>
					</li>
				</ul>
			</fieldset>
			<fieldset>
				<legend>Inclusive Ranges</legend>
				<ul class="cols">
					<li>
						<label for="checkin">Check-in</label>
						<input id="checkin" name="checkin" type="date">
					</li>
					<li>
						<label for="checkout">Check-out</label>
						<input id="checkout" name="checkout" type="date" data-fs-constraint="checkout >= checkin" data-fs-constraint-message="Check-out cannot precede check-in.">
						<small>On or after check-in date.</small>
					</li>
				</ul>
			</fieldset>
			<fieldset>
				<legend>Greater/Less Than Field</legend>
				<div class="cols">
					<fieldset>
						<legend>Number</legend>
						<ul>
							<li>
								<label for="base-number">Base Number</label>
								<input id="base-number" name="base-number" type="number">
							</li>
							<li>
								<label for="bigger-number">Bigger Number</label>
								<input id="bigger-number" name="bigger-number" type="number" data-fs-constraint="bigger-number > base-number" data-fs-constraint-message="Must be greater than the base number.">
							</li>
							<li>
								<label for="smaller-number">Smaller Number</label>
								<input id="smaller-number" name="smaller-number" type="number" data-fs-constraint="smaller-number < base-number" data-fs-constraint-message="Must be less than the base number.">
							</li>
						</ul>
					</fieldset>
					<fieldset>
						<legend>Duration</legend>
						<ul>
							<li>
								<label for="base-duration">Base Duration</label>
								<input id="base-duration" name="base-duration" type="text" data-fs-type="duration">
							</li>
							<li>
								<label for="longer-duration">Longer Duration</label>
								<input id="longer-duration" name="longer-duration" type="text" data-fs-type="duration" data-fs-constraint="longer-duration > base-duration" data-fs-constraint-message="Must be longer than the base duration.">
							</li>
							<li>
								<label for="shorter-duration">Shorter Duration</label>
								<input id="shorter-duration" name="shorter-duration" type="text" data-fs-type="duration" data-fs-constraint="shorter-duration < base-duration" data-fs-constraint-message="Must be shorter than the base duration.">
							</li>
						</ul>
					</fieldset>
				</div>
				<div class="cols">
					<fieldset>
						<legend>Date</legend>
						<ul>
							<li>
								<label for="base-date">Base Date</label>
								<input id="base-date" name="base-date" type="date">
							</li>
							<li>
								<label for="later-date">Later Date</label>
								<input id="later-date" name="later-date" type="date" data-fs-constraint="later-date > base-date" data-fs-constraint-message="Must be after the base date.">
							</li>
							<li>
								<label for="earlier-date">Earlier Date</label>
								<input id="earlier-date" name="earlier-date" type="date" data-fs-constraint="earlier-date < base-date" data-fs-constraint-message="Must be before the base date.">
							</li>
						</ul>
					</fieldset>
					<fieldset>
						<legend>Time</legend>
						<ul>
							<li>
								<label for="base-time">Base Time</label>
								<input id="base-time" name="base-time" type="time">
							</li>
							<li>
								<label for="later-time">Later Time</label>
								<input id="later-time" name="later-time" type="time" data-fs-constraint="later-time > base-time" data-fs-constraint-message="Must be after the base time.">
							</li>
							<li>
								<label for="earlier-time">Earlier Time</label>
								<input id="earlier-time" name="earlier-time" type="time" data-fs-constraint="earlier-time < base-time" data-fs-constraint-message="Must be before the base time.">
							</li>
						</ul>
					</fieldset>
				</div>
				<div class="cols">
					<fieldset>
						<legend>Date &amp; Time</legend>
						<ul>
							<li>
								<label for="base-datetime">Base Date &amp; Time</label>
								<input id="base-datetime" name="base-datetime" type="datetime-local">
							</li>
							<li>
								<label for="later-datetime">Later Date &amp; Time</label>
								<input id="later-datetime" name="later-datetime" type="datetime-local" data-fs-constraint="later-datetime > base-datetime" data-fs-constraint-message="Must be after the base date &amp; time.">
							</li>
							<li>
								<label for="earlier-datetime">Earlier Date &amp; Time</label>
								<input id="earlier-datetime" name="earlier-datetime" type="datetime-local" data-fs-constraint="earlier-datetime < base-datetime" data-fs-constraint-message="Must be before the base date &amp; time.">
							</li>
						</ul>
					</fieldset>
					<fieldset>
						<legend>US Dollars</legend>
						<ul>
							<li>
								<label for="base-amount">Base Amount</label>
								<input id="base-amount" name="base-amount" type="text" data-fs-type="us-dollar" data-fs-prefix="$">
							</li>
							<li>
								<label for="higher-amount">Higher Amount</label>
								<input id="higher-amount" name="higher-amount" type="text" data-fs-type="us-dollar" data-fs-prefix="$" data-fs-constraint="higher-amount > base-amount" data-fs-constraint-message="Must be more than the base amount.">
							</li>
							<li>
								<label for="lower-amount">Lower Amount</label>
								<input id="lower-amount" name="lower-amount" type="text" data-fs-type="us-dollar" data-fs-prefix="$" data-fs-constraint="lower-amount < base-amount" data-fs-constraint-message="Must be less than the base amount.">
							</li>
						</ul>
					</fieldset>
				</div>
			</fieldset>
			<button type="submit">Submit</button>
		</form>
	</main>
</body>
</html>
